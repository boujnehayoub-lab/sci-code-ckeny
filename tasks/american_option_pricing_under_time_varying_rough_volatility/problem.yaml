# =============================================================================
# PROBLEM DESCRIPTION (shown to LLM as context)
# =============================================================================

description: |
  Your task is to implement a modular framework for pricing American options under 
  time-varying rough volatility using signature-based methods. This framework extends 
  the signature pricing approach by incorporating three practical innovations from the 
  attached paper:
  
  1. **Gradient-boosted ensemble forecasting**: Use XGBoost to estimate and forecast 
     the time-varying Hurst parameter H(t) from rolling windows of volatility data.
  
  2. **Regime-switching volatility models**: Dynamically choose between rough Bergomi 
     (for rough volatility regimes, H < 0.5) and Heston (for smooth regimes, H ≥ 0.5) 
     based on forecasted Hurst parameter.
  
  3. **Efficient kernel approximation**: Use Random Fourier Features (RFF) to accelerate 
     signature-kernel evaluations while preserving accuracy.
  
  The implementation is organized into sequential steps (currently implementing steps 1-3):
  1. Estimate Hurst parameter from demeaned log returns using R/S statistic
  2. Forecast future Hurst values using XGBoost gradient-boosted ensemble
  3. Select volatility engine (rough Bergomi or Heston) based on forecasted Hurst
  
  Additional steps will be implemented incrementally to complete the full pipeline.
  
  Assumptions and Simplifications for SciCode:
  - Reduced scale: 100-500 paths (vs paper's 32,768), 10-20 time steps (vs 252)
  - Signature degree 2, level 2 (vs paper's degree 3, level 3)
  - XGBoost with n_estimators=100 (reduced from paper's full scale)
  - RFF dimension D=32 (vs paper's 128)
  - All inputs are synthetic, deterministic data (no external downloads)


# =============================================================================
# I/O SPECIFICATION (shown to LLM)
# =============================================================================

io_spec: |
  """
  American Option Pricing Under Time-Varying Rough Volatility
  
  This task implements a multi-step pipeline for pricing American options under 
  time-varying rough volatility using signature-based methods.
  
  Parameters
  ----------
  The task is currently decomposed into 3 sequential steps, each with its own function:
  
  Step 1 - estimate_hurst_parameter(returns):
    returns : np.ndarray, shape (n,)
      Demeaned log returns (n >= 8 required).
    Returns: hurst : float in [0, 1]
  
  Step 2 - forecast_hurst_path(historical_hurst, horizon, ...):
    historical_hurst : np.ndarray, shape (5,)
      Five most recent Hurst values [H_{t-4}, ..., H_t].
    horizon : int
      Forecast horizon (number of steps, typically 5-20).
    Returns: forecasted_hurst : np.ndarray, shape (horizon,)
  
  Step 3 - select_volatility_engine(forecasted_hurst, threshold=0.5):
    forecasted_hurst : np.ndarray, shape (horizon,)
      Forecasted Hurst parameter path.
    Returns: engine : str ('rough_bergomi' or 'heston')
  
  Returns
  -------
  Step 3 returns a string indicating the selected volatility engine:
  - 'rough_bergomi': Selected when average forecasted Hurst < threshold (rough volatility regime)
  - 'heston': Selected when average forecasted Hurst >= threshold (smooth volatility regime)
  
  Units
  -----
  - Hurst parameter: dimensionless, in [0, 1]
  """



# =============================================================================
# BACKGROUND (OPTIONAL)
# =============================================================================

background_main: |
  This task implements a modular framework for American option pricing under time-varying 
  rough volatility, extending the signature pricing framework with three practical innovations:
  
  1. **Gradient-Boosted Ensemble Forecasting**: The paper's first innovation uses XGBoost 
     to estimate and forecast the time-varying Hurst parameter H(t) from rolling windows 
     of recent volatility data. This enables dynamic adaptation to changing market roughness.
  
  2. **Regime-Switching Volatility Models**: The framework dynamically selects between 
     rough Bergomi (for rough volatility regimes where H < 0.5) and Heston (for smooth 
     regimes where H ≥ 0.5) based on forecasted Hurst parameter. This hybrid approach 
     adapts to changing volatility roughness.
  
  3. **Random Fourier Features (RFF)**: The third innovation accelerates signature-kernel 
     evaluations using Random Fourier Features, reducing computational cost from O(m) to 
     O(D) per kernel evaluation while preserving accuracy.
  
  The current implementation (steps 1-3):
  - Estimates Hurst parameter using rescaled-range (R/S) statistic
  - Forecasts future Hurst values using XGBoost gradient-boosted ensemble
  - Selects volatility engine (rough Bergomi or Heston) based on forecast
  
  Additional steps will be implemented incrementally to complete the full pipeline.
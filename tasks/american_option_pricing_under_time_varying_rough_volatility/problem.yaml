subdomain: "Computational Finance"


# =============================================================================
# PROBLEM DESCRIPTION (shown to LLM as context)
# =============================================================================

description: |
  Your task is to implement a modular framework for pricing American options under 
  time-varying rough volatility using signature-based methods. This framework extends 
  the signature pricing approach by incorporating three practical innovations from the 
  attached paper:
  
  1. **Gradient-boosted ensemble forecasting**: Use XGBoost to estimate and forecast 
     the time-varying Hurst parameter H(t) from rolling windows of volatility data.
  
  2. **Regime-switching volatility models**: Dynamically choose between rough Bergomi 
     (for rough volatility regimes, H < 0.5) and Heston (for smooth regimes, H ≥ 0.5) 
     based on forecasted Hurst parameter.
  
  3. **Efficient kernel approximation**: Use Random Fourier Features (RFF) to accelerate 
     signature-kernel evaluations while preserving accuracy.
  
  The implementation is organized into 8 sequential steps:
  1. Estimate Hurst parameter from demeaned log returns using R/S statistic
  2. Forecast future Hurst values using XGBoost gradient-boosted ensemble
  3. Select volatility engine (rough Bergomi or Heston) based on forecasted Hurst
  4. Calibrate model parameters from synthetic price and volatility data
  5. Simulate variance paths using the selected volatility engine
  6. Compute path signatures from variance paths using numerical integration
  7. Apply Random Fourier Features to embed signatures efficiently
  8. Compute option price bounds using signature-based optimal stopping (FINAL INTEGRATION)
  
  Assumptions and Simplifications for SciCode:
  - Reduced scale: 100-500 paths (vs paper's 32,768), 10-20 time steps (vs 252)
  - Signature degree 2, level 2 (vs paper's degree 3, level 3)
  - XGBoost with n_estimators=100 (reduced from paper's full scale)
  - RFF dimension D=32 (vs paper's 128)
  - All inputs are synthetic, deterministic data (no external downloads)


# =============================================================================
# I/O SPECIFICATION (shown to LLM)
# =============================================================================

io_spec: |
  """
  American Option Pricing Under Time-Varying Rough Volatility
  
  This task implements a multi-step pipeline for pricing American options under 
  time-varying rough volatility using signature-based methods.
  
  Parameters
  ----------
  The task is decomposed into 8 sequential steps, each with its own function:
  
  Step 1 - estimate_hurst_parameter(returns):
    returns : np.ndarray, shape (n,)
      Demeaned log returns (n >= 8 required).
    Returns: hurst : float in [0, 1]
  
  Step 2 - forecast_hurst_path(historical_hurst, horizon, ...):
    historical_hurst : np.ndarray, shape (5,)
      Five most recent Hurst values [H_{t-4}, ..., H_t].
    horizon : int
      Forecast horizon (number of steps, typically 5-20).
    Returns: forecasted_hurst : np.ndarray, shape (horizon,)
  
  Step 3 - select_volatility_engine(forecasted_hurst, threshold=0.5):
    forecasted_hurst : np.ndarray, shape (horizon,)
      Forecasted Hurst parameter path.
    Returns: engine : str ('rough_bergomi' or 'heston')
  
  Step 4 - calibrate_parameters(engine, price_data, vol_data, historical_hurst, dt):
    engine : str
      'rough_bergomi' or 'heston'.
    price_data : np.ndarray, shape (n,)
      Synthetic log price series (or log returns).
    vol_data : np.ndarray, shape (n,)
      Synthetic implied volatility series (ATM).
    historical_hurst : float
      Most recent historical Hurst parameter.
    dt : float, optional
      Time step (default 1/252 for daily).
    Returns: params : dict
      Dictionary with keys 'rho', 'eta', 'xi0', and optionally 'kappa', 'theta' (for Heston)
  
  Step 5 - simulate_volatility_paths(engine, params, num_paths, num_steps, dt, hurst_path, random_state):
    engine : str
      'rough_bergomi' or 'heston'.
    params : dict
      Calibrated parameters from step 4.
    num_paths : int
      Number of paths (M, typically 100-500 for SciCode).
    num_steps : int
      Number of time steps (N, typically 10-20 for SciCode).
    dt : float
      Time step size.
    hurst_path : np.ndarray, shape (num_steps,), optional
      Time-varying Hurst path (required for rough Bergomi).
    random_state : int, optional
      Random seed for reproducibility.
    Returns: variance_paths : np.ndarray, shape (num_paths, num_steps)
      Simulated variance paths. All values must be > 0.
  
  Step 6 - compute_path_signatures(variance_paths, degree, level):
    variance_paths : np.ndarray, shape (num_paths, num_steps)
      Variance paths from step 5.
    degree : int, optional
      Signature truncation degree (default 2 for SciCode).
    level : int, optional
      Signature truncation level (default 2 for SciCode).
    Returns: signatures : np.ndarray, shape (num_paths, m)
      Signature vectors where m = degree + 1.
      For degree=2, m = 3.
  
  Step 7 - apply_random_fourier_features(signatures, D, gamma, random_state):
    signatures : np.ndarray, shape (num_paths, m)
      Signature vectors from step 6.
    D : int, optional
      RFF dimension (default 32 for SciCode).
    gamma : float, optional
      Kernel bandwidth parameter (default 1.0).
    random_state : int, optional
      Random seed for projection matrix (for reproducibility).
    Returns: rff_embeddings : np.ndarray, shape (num_paths, 2*D)
      RFF embeddings (sine and cosine concatenated).
  
  Step 8 - compute_option_price_bounds(rff_embeddings, variance_paths, initial_price, strike, risk_free_rate, exercise_dates, dt, method, random_state):
    rff_embeddings : np.ndarray, shape (num_paths, 2*D)
      RFF embeddings from step 7 (features for regression).
    variance_paths : np.ndarray, shape (num_paths, num_steps)
      Variance paths from step 5. Used to generate asset price paths.
    initial_price : float
      Initial asset price S_0.
    strike : float
      Option strike price K.
    risk_free_rate : float
      Risk-free interest rate r.
    exercise_dates : np.ndarray, shape (n_exercise,)
      Time indices where early exercise is allowed.
    dt : float
      Time step size.
    method : str, optional
      Regression method: 'linear' (default).
    random_state : int, optional
      Random seed for asset path generation (for reproducibility).
    Returns: bounds : dict
      Dictionary with keys:
      - 'lower_bound': float, primal (lower) bound on option price
      - 'upper_bound': float, dual (upper) bound on option price
      - 'duality_gap': float, upper_bound - lower_bound
      - 'duality_gap_percent': float, (duality_gap / lower_bound) * 100
  
  Returns
  -------
  Step 8 (FINAL INTEGRATION) returns a dictionary of option price bounds:
  - bounds: dict with keys 'lower_bound', 'upper_bound', 'duality_gap', 'duality_gap_percent'
    All values are floats. Lower bound ≤ upper bound (primal-dual property)
  
  Units
  -----
  - Hurst parameter: dimensionless, in [0, 1]
  """



# =============================================================================
# BACKGROUND (OPTIONAL)
# =============================================================================

background_main: |
  The Least Squares Monte Carlo (LSM) method, introduced by Longstaff and Schwartz (2001),
  is a powerful technique for pricing American-style options. The key insight is to use 
  least squares regression to estimate the continuation value (the value of holding the 
  option) at each exercise date.
  
  For a time-capped American option, the exercise decision must account for both:
  1. The immediate exercise value vs. continuation value (standard American option logic)
  2. The constraint that exercise must occur before or at time $T_c$
  
  The algorithm proceeds backward in time from maturity:
  - At maturity, exercise if in-the-money
  - At each earlier time step $t$, compare immediate exercise value $h(S_t)$ with 
    estimated continuation value $\hat{C}(S_t)$
  - Exercise if $h(S_t) \geq \hat{C}(S_t)$ and $t \leq T_c$
  - Use least squares regression on in-the-money paths to estimate continuation values
  
  The option price is computed as the discounted average of cash flows along all paths,
  where cash flows occur at the optimal exercise times determined by the algorithm.
